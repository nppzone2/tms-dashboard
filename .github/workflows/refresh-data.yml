name: Refresh TMS Dashboard Data

on:
  push:
    paths:
      - 'input/TMS Order Detail.xlsx'
      - 'input/Fill Rate.xlsx'

  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh-data:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run TMS Engine V2.0
        run: |
          python engine/refresh_engine.py

      - name: Commit generated data
        run: |
          git config user.name "TMS Dashboard Bot"
          git config user.email "actions@github.com"

          git add data/

          if git diff --cached --quiet; then
            echo "No data changes."
          else
            git commit -m "Auto refresh TMS dashboard data"
            git push
          fi
