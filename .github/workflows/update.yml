name: Update TMS Dashboard

on:
  push:
    paths:
      - "input/Fill Rate.xlsx"
      - "input/TMS OrderDetail.xlsx"
      - "scripts/process_data.py"
  workflow_dispatch:
  schedule:
    - cron: "0 2 * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install packages
        run: pip install pandas openpyxl

      - name: Build dashboard data
        run: python scripts/process_data.py

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.json
          git diff --cached --quiet || git commit -m "Update TMS dashboard data"
          git push
